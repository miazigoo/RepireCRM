# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        files: ^backend/

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^backend/

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: .venv/bin/flake8 --config=backend/.flake8
        language: system
        files: ^backend/
        types: [python]
        exclude: ^backend/(.flake8|.*/migrations/)

      - id: mypy-client-portal
        name: mypy client portal
        entry: .venv/bin/mypy --config-file backend/pyproject.toml backend/client_portal backend/tests/test_client_portal.py
        language: system
        pass_filenames: false
        files: ^backend/(client_portal|tests/test_client_portal\.py)
