# .github/workflows/ci.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_repair_crm
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run linting
      run: |
        black --check \
          backend/core/api_app.py \
          backend/core/asgi.py \
          backend/core/middleware.py \
          backend/customers/customers_schemas.py \
          backend/client_portal \
          backend/orders/admin.py \
          backend/orders/models.py \
          backend/orders/router.py \
          backend/orders/orders_schemas.py \
          backend/tests/test_client_portal.py \
          backend/tests/test_orders.py \
          backend/tests/test_production_config.py
        isort --check-only \
          backend/core/api_app.py \
          backend/core/asgi.py \
          backend/core/middleware.py \
          backend/customers/customers_schemas.py \
          backend/client_portal \
          backend/orders/admin.py \
          backend/orders/models.py \
          backend/orders/router.py \
          backend/orders/orders_schemas.py \
          backend/tests/test_client_portal.py \
          backend/tests/test_orders.py \
          backend/tests/test_production_config.py
        flake8 --config=backend/.flake8 \
          backend/core/api_app.py \
          backend/core/asgi.py \
          backend/core/middleware.py \
          backend/customers/customers_schemas.py \
          backend/client_portal \
          backend/orders/admin.py \
          backend/orders/models.py \
          backend/orders/router.py \
          backend/orders/orders_schemas.py \
          backend/tests/test_client_portal.py \
          backend/tests/test_orders.py \
          backend/tests/test_production_config.py
        mypy --config-file backend/pyproject.toml backend/client_portal backend/tests/test_client_portal.py

    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_repair_crm
      run: |
        cd backend
        python manage.py test

  test-frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/crm-app/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend/crm-app
        npm ci

    - name: Build production frontend
      run: |
        cd frontend/crm-app
        npm run build:prod

    - name: Run tests
      run: |
        cd frontend/crm-app
        npm run test -- --watch=false --browsers=ChromeHeadless

  build-and-deploy:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Build and push Docker images
      run: |
        docker build -f docker/Dockerfile.backend -t repair-crm-backend .
        docker build -f docker/Dockerfile.frontend-prod -t repair-crm-frontend .
        # Здесь можно добавить push в registry
