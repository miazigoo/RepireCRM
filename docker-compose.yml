x-backend-environment: &backend-environment
  DEBUG: "False"
  ENVIRONMENT: production
  DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-repair_crm}"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "${SECRET_KEY}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
  SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}"
  SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-False}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-False}"
  CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-False}"
  FRONTEND_URL: "${FRONTEND_URL:-}"
  BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL:-}"
  YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
  YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
  YOOKASSA_API_URL: "${YOOKASSA_API_URL:-https://api.yookassa.ru/v3}"
  YOOKASSA_MOCK: "${YOOKASSA_MOCK:-false}"
  YOOKASSA_CAPTURE: "${YOOKASSA_CAPTURE:-true}"
  PORTAL_DEFAULT_SHOP_CODE: "${PORTAL_DEFAULT_SHOP_CODE:-}"
  SENTRY_DSN: "${SENTRY_DSN:-}"
  SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0.0}"
  SENTRY_SEND_DEFAULT_PII: "${SENTRY_SEND_DEFAULT_PII:-false}"
  EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}"
  EMAIL_HOST: "${EMAIL_HOST:-}"
  EMAIL_PORT: "${EMAIL_PORT:-587}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-True}"
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-noreply@b00bs.ru}"
  COMMUNICATIONS_ENABLE_EMAIL: "${COMMUNICATIONS_ENABLE_EMAIL:-false}"
  COMMUNICATIONS_ENABLE_SMS: "${COMMUNICATIONS_ENABLE_SMS:-false}"
  TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
  TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
  TWILIO_FROM_NUMBER: "${TWILIO_FROM_NUMBER:-}"
  ADMIN_SERVICE_URL: "${ADMIN_SERVICE_URL:-}"
  ADMIN_SERVICE_AGENT_TOKEN: "${ADMIN_SERVICE_AGENT_TOKEN:-}"
  ADMIN_SERVICE_HEARTBEAT_ENABLED: "${ADMIN_SERVICE_HEARTBEAT_ENABLED:-false}"
  ADMIN_SERVICE_HEARTBEAT_INTERVAL_SECONDS: "${ADMIN_SERVICE_HEARTBEAT_INTERVAL_SECONDS:-300}"
  ADMIN_SERVICE_TIMEOUT_SECONDS: "${ADMIN_SERVICE_TIMEOUT_SECONDS:-5}"
  ADMIN_SERVICE_ENFORCEMENT_ENABLED: "${ADMIN_SERVICE_ENFORCEMENT_ENABLED:-false}"
  ADMIN_SERVICE_ENFORCEMENT_REQUIRE_SYNC: "${ADMIN_SERVICE_ENFORCEMENT_REQUIRE_SYNC:-false}"
  ADMIN_SERVICE_ENFORCEMENT_STALE_GRACE_HOURS: "${ADMIN_SERVICE_ENFORCEMENT_STALE_GRACE_HOURS:-72}"
  ADMIN_SERVICE_ENFORCEMENT_ALLOW_SUPERUSER_BYPASS: "${ADMIN_SERVICE_ENFORCEMENT_ALLOW_SUPERUSER_BYPASS:-true}"

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend-prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      <<: *backend-environment
      APP_SERVER: "${APP_SERVER:-daphne}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python - <<'PY'\nimport urllib.request\nrequest = urllib.request.Request('http://127.0.0.1:8000/api/health', headers={'Host': '127.0.0.1', 'X-Forwarded-Proto': 'https'})\nurllib.request.urlopen(request, timeout=5).read()\nPY",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  subscription-checker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: >
      sh -c "
        while true; do
          python manage.py check_subscriptions;
          sleep \"${SUBSCRIPTION_CHECK_INTERVAL_SECONDS:-86400}\";
        done
      "
    environment:
      <<: *backend-environment
      SUBSCRIPTION_CHECK_INTERVAL_SECONDS: "${SUBSCRIPTION_CHECK_INTERVAL_SECONDS:-86400}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/static

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A core worker -l info
    environment:
      <<: *backend-environment
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/static

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A core beat -l info
    environment:
      <<: *backend-environment
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/static

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-repair_crm}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-repair_crm}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  db-backup:
    build:
      context: .
      dockerfile: docker/Dockerfile.backup
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-repair_crm}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_BACKUP_INTERVAL_SECONDS: "${POSTGRES_BACKUP_INTERVAL_SECONDS:-86400}"
      POSTGRES_BACKUP_RETENTION_DAYS: "${POSTGRES_BACKUP_RETENTION_DAYS:-14}"
      BACKUP_INCLUDE_MEDIA: "${BACKUP_INCLUDE_MEDIA:-true}"
      BACKUP_RCLONE_REMOTE: "${BACKUP_RCLONE_REMOTE:-}"
      BACKUP_SYNC_MAX_AGE: "${BACKUP_SYNC_MAX_AGE:-48h}"
      RCLONE_CONFIG_B64: "${RCLONE_CONFIG_B64:-}"
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
      ALERT_WEBHOOK_TIMEOUT_SECONDS: "${ALERT_WEBHOOK_TIMEOUT_SECONDS:-10}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/backups
      - media_data:/media:ro

  health-monitor:
    build:
      context: .
      dockerfile: docker/Dockerfile.monitor
    environment:
      MONITOR_TARGETS: "${MONITOR_TARGETS:-frontend=http://frontend/ backend=http://backend:8000/api/health}"
      MONITOR_INTERVAL_SECONDS: "${MONITOR_INTERVAL_SECONDS:-60}"
      MONITOR_TIMEOUT_SECONDS: "${MONITOR_TIMEOUT_SECONDS:-10}"
      MONITOR_FAILURE_THRESHOLD: "${MONITOR_FAILURE_THRESHOLD:-3}"
      MONITOR_HOST_HEADER: "${MONITOR_HOST_HEADER:-b00bs.ru}"
      MONITOR_FORWARDED_PROTO: "${MONITOR_FORWARDED_PROTO:-https}"
      ALERT_WEBHOOK_URL: "${ALERT_WEBHOOK_URL:-}"
      ALERT_WEBHOOK_TIMEOUT_SECONDS: "${ALERT_WEBHOOK_TIMEOUT_SECONDS:-10}"
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  backup_data:
