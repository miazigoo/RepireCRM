x-backend-environment: &backend-environment
  DEBUG: "False"
  ENVIRONMENT: production
  DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-repair_crm}"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "${SECRET_KEY}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS}"
  CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
  SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}"
  SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-False}"
  SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-False}"
  CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-False}"
  FRONTEND_URL: "${FRONTEND_URL:-}"
  BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL:-}"
  YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
  YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
  YOOKASSA_API_URL: "${YOOKASSA_API_URL:-https://api.yookassa.ru/v3}"
  YOOKASSA_MOCK: "${YOOKASSA_MOCK:-false}"
  YOOKASSA_CAPTURE: "${YOOKASSA_CAPTURE:-true}"
  PORTAL_DEFAULT_SHOP_CODE: "${PORTAL_DEFAULT_SHOP_CODE:-}"
  SENTRY_DSN: "${SENTRY_DSN:-}"

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend-prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media_data:/var/www/media:ro
      - static_data:/var/www/static:ro

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    environment:
      <<: *backend-environment
      APP_SERVER: "${APP_SERVER:-daphne}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  subscription-checker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: >
      sh -c "
        while true; do
          python manage.py check_subscriptions;
          sleep \"${SUBSCRIPTION_CHECK_INTERVAL_SECONDS:-86400}\";
        done
      "
    environment:
      <<: *backend-environment
      SUBSCRIPTION_CHECK_INTERVAL_SECONDS: "${SUBSCRIPTION_CHECK_INTERVAL_SECONDS:-86400}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/static

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A core worker -l info
    environment:
      <<: *backend-environment
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/static

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: celery -A core beat -l info
    environment:
      <<: *backend-environment
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_data:/app/media
      - static_data:/app/static

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-repair_crm}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-repair_crm}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
