log_format repaircrm_timing '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
  'rt=$request_time urt=$upstream_response_time '
  'uct=$upstream_connect_time uht=$upstream_header_time gzip=$gzip_ratio';

access_log /var/log/nginx/repaircrm_timing.log repaircrm_timing;
