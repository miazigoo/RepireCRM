<section class="avatar-preview-dialog">
  <header>
    <div>
      <span>Аватар сотрудника</span>
      <h2>{{ data.displayName }}</h2>
    </div>
    <button type="button" class="icon-button" (click)="close()" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 6l12 12"></path>
        <path d="M18 6 6 18"></path>
      </svg>
    </button>
  </header>

  <mat-dialog-content>
    <div class="avatar-stage">
      <img [src]="data.avatarUrl" [alt]="data.displayName">
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="close('replace')">Заменить</button>
    <button mat-flat-button type="button" (click)="close('edit')">Редактировать</button>
  </mat-dialog-actions>
</section>
