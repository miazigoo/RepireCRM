<div class="purchase-form-page">
  <div class="page-header">
    <div>
      <h1>Заказ поставщику</h1>
      <p>Закупка товаров на выбранный магазин</p>
    </div>
    <button mat-button type="button" (click)="cancel()">
      <mat-icon>arrow_back</mat-icon>
      Назад
    </button>
  </div>

  <mat-card class="form-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="form-grid">
          <mat-form-field>
            <mat-label>Поставщик из списка</mat-label>
            <mat-select formControlName="supplier_id">
              <mat-option [value]="null">Новый поставщик</mat-option>
              <mat-option *ngFor="let supplier of suppliers" [value]="supplier.id">
                {{ supplier.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field>
            <mat-label>Новый поставщик</mat-label>
            <input matInput formControlName="supplier_name" autocomplete="off">
          </mat-form-field>

          <mat-form-field>
            <mat-label>Товар</mat-label>
            <mat-select formControlName="item_id" required (selectionChange)="onItemSelected($event.value)">
              <mat-option *ngFor="let item of items" [value]="item.id">
                {{ item.name }} · {{ item.sku }}
              </mat-option>
            </mat-select>
            <mat-error *ngIf="form.get('item_id')?.hasError('required')">
              Выберите товар
            </mat-error>
          </mat-form-field>

          <mat-form-field>
            <mat-label>Количество</mat-label>
            <input matInput type="number" formControlName="quantity" min="1" required>
          </mat-form-field>

          <mat-form-field>
            <mat-label>Цена закупки</mat-label>
            <input matInput type="number" formControlName="unit_price" min="0" required>
            <span matTextSuffix>₽</span>
          </mat-form-field>

          <mat-form-field class="span-2">
            <mat-label>Комментарий</mat-label>
            <textarea matInput formControlName="notes" rows="3"></textarea>
          </mat-form-field>
        </div>

        <div class="empty-state" *ngIf="items.length === 0">
          <mat-icon>inventory_2</mat-icon>
          <span>Для закупки сначала добавьте хотя бы один товар на склад.</span>
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="cancel()">Отмена</button>
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="loading || items.length === 0">
            <mat-spinner *ngIf="loading" diameter="18"></mat-spinner>
            <mat-icon *ngIf="!loading">shopping_cart</mat-icon>
            <span>{{ loading ? 'Создание' : 'Создать заказ' }}</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
