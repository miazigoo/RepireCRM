<section class="notifications-panel" (click)="$event.stopPropagation()">
  <header class="notifications-header">
    <div>
      <span class="panel-kicker">Центр событий</span>
      <h4>Уведомления</h4>
    </div>

    <div class="header-actions">
      <span class="unread-pill" *ngIf="((unreadCount$ | async) || 0) > 0">
        {{ unreadCount$ | async }}
      </span>
      <button mat-icon-button type="button" matTooltip="Обновить" (click)="refresh()">
        <mat-icon>refresh</mat-icon>
      </button>
      <button
        mat-button
        type="button"
        *ngIf="((unreadCount$ | async) || 0) > 0"
        (click)="markAllAsRead()">
        Прочитать все
      </button>
    </div>
  </header>

  <div class="connection-note" *ngIf="(connectionStatus$ | async) === false">
    <mat-icon>sync_problem</mat-icon>
    <span>Лента временно недоступна. Попробуйте обновить.</span>
  </div>

  <mat-divider></mat-divider>

  <ng-container *ngIf="notifications$ | async as notifications">
    <div class="notifications-list" *ngIf="notifications.length > 0; else noNotifications">
      <button
        *ngFor="let notification of notifications.slice(0, 10)"
        type="button"
        class="notification-item"
        [ngClass]="getPriorityClass(notification.priority)"
        (click)="onNotificationClick(notification)">
        <span class="notification-icon" [style.color]="resolveColor(notification.color)">
          <mat-icon>{{ notification.icon || 'notifications' }}</mat-icon>
        </span>

        <span class="notification-content">
          <span class="notification-title">
            <span>{{ notification.title }}</span>
            <mat-icon
              class="priority-icon"
              *ngIf="notification.priority !== 'normal'"
              [matTooltip]="getPriorityLabel(notification.priority)">
              {{ getPriorityIcon(notification.priority) }}
            </mat-icon>
          </span>
          <span class="notification-message">{{ notification.message }}</span>
          <span class="notification-time">{{ getRelativeTime(notification.created_at) }}</span>
        </span>
      </button>
    </div>
  </ng-container>

  <ng-template #noNotifications>
    <div class="no-notifications">
      <mat-icon>notifications_none</mat-icon>
      <strong>Новых уведомлений нет</strong>
      <span>Важные события появятся здесь.</span>
    </div>
  </ng-template>
</section>
