map $http_x_forwarded_proto $repaircrm_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Статические файлы Angular
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Заголовки для правильной работы SPA
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Font files need explicit MIME types because nosniff blocks octet-stream fonts.
    location ~* \.(?:woff2?|ttf|otf|eot)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        types {
            font/woff woff;
            font/woff2 woff2;
            font/ttf ttf;
            font/otf otf;
            application/vnd.ms-fontobject eot;
        }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Хешированные JS/CSS/assets Angular можно кешировать агрессивно.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|ico)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Проксирование API запросов к Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $repaircrm_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket уведомления Django Channels
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $repaircrm_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
    }

    # Статические файлы Django
    location ^~ /static/ {
        alias /var/www/static/;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    # Медиа файлы Django
    location ^~ /media/ {
        alias /var/www/media/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Обработка ошибок
    error_page 404 /index.html;
}
